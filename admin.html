<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electoral Admin — Ex-Students Election</title>
<link rel="stylesheet" href="./css/style.css?v=31">
<style>
  .admin-wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  .admin-gate{max-width:420px;margin:80px auto;background:#fff;padding:28px;
    border-radius:14px;box-shadow:0 6px 24px rgba(15,23,42,.1)}
  .admin-gate h1{font-size:20px;margin:0 0 18px}
  .admin-header{display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .admin-header h1{margin:0;font-size:20px}
  .admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
  .admin-actions .btn{padding:11px 18px;font-size:14px}
  .tbl-wrap{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(15,23,42,.06);
    overflow-x:auto;margin-bottom:22px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
  table.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid #eef2f7;text-align:left;
    white-space:nowrap}
  table.tbl th{background:#f1f5f9;font-size:11px;letter-spacing:.5px;color:#475569;
    text-transform:uppercase;position:sticky;top:0}
  table.tbl tr:hover td{background:#f8fafc}
  .section-title{font-size:15px;font-weight:800;letter-spacing:1px;
    color:#1a3a6b;margin:24px 0 10px}
  .winner-card{background:linear-gradient(135deg,#fef3c7,#fde68a);
    border-radius:14px;padding:20px;margin-bottom:14px;
    border-left:6px solid #f2b705;box-shadow:0 4px 14px rgba(242,183,5,.25)}
  .winner-card .position{font-size:11px;letter-spacing:2px;color:#78350f;
    font-weight:800;text-transform:uppercase;margin-bottom:4px}
  .winner-card .name{font-size:20px;font-weight:800;color:#111}
  .winner-card .votes{font-size:13px;color:#78350f;margin-top:4px}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;margin-bottom:20px}
  .stat-tile{background:#fff;border-radius:12px;padding:16px;
    box-shadow:0 2px 10px rgba(15,23,42,.06);text-align:center}
  .stat-tile .n{font-size:22px;font-weight:800;color:#1a3a6b}
  .stat-tile .l{font-size:10px;letter-spacing:1px;color:#64748b;margin-top:4px;font-weight:700}
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .filter-bar input,.filter-bar select{padding:10px 12px;border:1.5px solid #e2e8f0;
    border-radius:10px;font-size:14px;background:#fff;outline:none}
  .filter-bar input:focus,.filter-bar select:focus{border-color:#3b82f6}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<section id="gate" class="admin-gate">
  <h1>Electoral Access</h1>
  <form id="gate-form" autocomplete="off">
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" required style="width:100%;padding:12px;
        border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px" autofocus>
    </label>
    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">UNLOCK</button>
    <p class="error-msg" id="gate-error"></p>
  </form>
</section>

<!-- DASHBOARD -->
<section id="dashboard" style="display:none">
  <main class="admin-wrap">
    <header class="admin-header">
      <div>
        <h1 id="election-title">Election Report</h1>
        <div id="election-status" style="color:#64748b;font-size:13px;margin-top:4px"></div>
      </div>
      <button class="btn btn-ghost" id="lock-btn" type="button">Lock</button>
    </header>

    <div class="stat-row" id="stats"></div>

    <div class="admin-actions">
      <button class="btn btn-primary" data-act="pdf">DOWNLOAD FULL REPORT (PDF)</button>
      <button class="btn btn-primary" data-act="csv-votes">DOWNLOAD VOTES CSV</button>
      <button class="btn btn-ghost" data-act="csv-voters">DOWNLOAD VOTER REPORT CSV</button>
      <button class="btn btn-ghost" data-act="csv-participation">DOWNLOAD PARTICIPATION CSV</button>
      <button class="btn btn-ghost" data-act="refresh">REFRESH</button>
    </div>

    <h2 class="section-title">WINNERS</h2>
    <div id="winners"></div>

    <h2 class="section-title">ALL VOTES</h2>
    <div class="filter-bar">
      <select id="filter-position"><option value="">All positions</option></select>
      <input id="filter-voter" placeholder="Filter by voter name or phone…" style="min-width:220px">
      <span id="row-count" style="color:#64748b;font-size:13px"></span>
    </div>
    <div class="tbl-wrap">
      <table class="tbl" id="votes-tbl">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Voter ID</th>
            <th>Voter Name</th>
            <th>Voter Phone</th>
            <th>Position</th>
            <th>Nominee ID</th>
            <th>Nominee Name</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <h2 class="section-title">VOTER PARTICIPATION</h2>
    <div class="tbl-wrap">
      <table class="tbl" id="voters-tbl">
        <thead>
          <tr>
            <th>Voter ID</th>
            <th>Full Name</th>
            <th>Phone</th>
            <th>Has Voted</th>
            <th>Positions Voted</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</section>

<script src="./js/admin.js?v=31"></script>
</body>
</html>
